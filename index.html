<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Hóa Học Chính Xác</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Tùy chỉnh hiển thị chỉ số dưới cho công thức hóa học */
    sub { 
      font-size: 0.65em; 
      vertical-align: sub; 
      font-weight: 600;
    }
    
    /* Hiệu ứng Glassmorphism */
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Hiệu ứng rung khi trả lời sai */
    .wrong-shake { 
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; 
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    input {
      transition: all 0.3s ease;
    }
    
    .fade-in {
      animation: fadeIn 0.3s ease-in;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800 antialiased">

  <!-- Nút Quay lại Menu chính -->
  <button id="backBtn" onclick="goHome()" class="hidden fixed top-4 left-4 bg-white/10 hover:bg-white/25 text-white rounded-full w-12 h-12 flex items-center justify-center transition-all duration-200 shadow-lg backdrop-blur-md z-50 border border-white/10 group">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
  </button>

  <div id="mainContainer" class="glass-card rounded-3xl w-full max-w-md p-6 sm:p-8 text-center transition-all duration-300 relative overflow-hidden">
    
    <!-- Tiêu đề -->
    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-500 mb-1 flex justify-center items-center gap-2 drop-shadow-sm">
      <span class="text-3xl drop-shadow-md">🧪</span> Ôn Hóa Học
    </h1>
    <p class="text-xs text-red-500 font-bold mb-6 tracking-wide uppercase">Lưu ý: Phải viết đúng hoa/thường</p>

    <!-- GIAO DIỆN MENU -->
    <div id="menu" class="fade-in">
      <p class="text-slate-500 text-sm mb-8">Chọn chế độ để bắt đầu lượt chơi 21 câu hỏi</p>
      
      <div class="grid grid-cols-1 gap-4 mb-4 mt-4">
        <button onclick="startMode('valency')" class="bg-gradient-to-b from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold py-5 px-4 rounded-2xl shadow-lg shadow-blue-500/30 transition-all active:scale-95 border border-blue-400/50 text-xl">
          Ôn tập Hóa Trị
        </button>
        <button onclick="startMode('symbol')" class="bg-gradient-to-b from-cyan-500 to-cyan-600 hover:from-cyan-600 hover:to-cyan-700 text-white font-bold py-5 px-4 rounded-2xl shadow-lg shadow-cyan-500/30 transition-all active:scale-95 border border-cyan-400/50 text-xl">
          Ôn tập Kí Hiệu
        </button>
      </div>
    </div>

    <!-- GIAO DIỆN TRÒ CHƠI -->
    <div id="game" class="hidden">
      <!-- Thanh tiến trình -->
      <div class="w-full bg-slate-200 rounded-full h-1.5 mb-4">
        <div id="progressBar" class="bg-blue-600 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Câu hỏi <span id="currentQuestionNum">1</span>/21</p>

      <!-- Câu hỏi & Đồng hồ -->
      <div class="mb-4 relative">
        <div id="question" class="text-6xl font-black text-slate-800 my-4 tracking-wider drop-shadow-sm h-24 flex items-center justify-center leading-none"></div>
        <div class="inline-flex items-center justify-center gap-2 text-lg font-bold text-slate-600 bg-slate-100/80 border border-slate-200 py-1.5 px-5 rounded-xl shadow-sm">
          ⏱️ <span id="timer" class="text-blue-600 w-8 text-center">30</span>s
        </div>
      </div>

      <!-- Ô nhập đáp án -->
      <div class="relative mb-4">
        <input id="answer" type="text" onkeydown="enterKey(event)" placeholder="Nhập đáp án..." autocomplete="off" autocorrect="off" spellcheck="false"
          class="w-full px-4 py-4 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none text-center text-3xl font-bold shadow-inner bg-white text-slate-800">
      </div>
      
      <!-- Các nút hành động -->
      <button id="submitBtn" onclick="checkAnswer()" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all active:scale-95 text-lg">
        Xác nhận
      </button>
      <button id="nextBtn" onclick="nextQuestion()" class="hidden w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-500/30 transition-all active:scale-95 text-lg flex items-center justify-center gap-2">
        Tiếp theo <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
      </button>

      <!-- Phản hồi (Đúng/Sai) -->
      <div id="result" class="min-h-[56px] mt-4 text-lg font-bold flex items-center justify-center rounded-xl bg-slate-50/50 text-center px-2"></div>

      <!-- Chỉ số Điểm & Chuỗi -->
      <div class="mt-6 grid grid-cols-2 gap-4 bg-slate-100/80 p-4 rounded-2xl border border-slate-200">
        <div class="text-center border-r border-slate-300">
          <p class="text-[11px] tracking-widest uppercase text-slate-500 font-bold mb-1">Điểm</p>
          <p id="score" class="font-black text-2xl text-blue-600 drop-shadow-sm">0</p>
        </div>
        <div class="text-center">
          <p class="text-[11px] tracking-widest uppercase text-slate-500 font-bold mb-1">Chuỗi</p>
          <p id="streak" class="font-black text-2xl text-orange-500 drop-shadow-sm">0</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- DỮ LIỆU ---
    const rawValencyData = [
      {q: "H", a: "I"}, {q: "C", a: "II,IV"}, {q: "N", a: "II,III,IV,..."}, {q: "O", a: "II"},
      {q: "Na", a: "I"}, {q: "Mg", a: "II"}, {q: "Al", a: "III"}, {q: "P", a: "III,V"},
      {q: "S", a: "II,IV,VI"}, {q: "Cl", a: "I,..."}, {q: "K", a: "I"}, {q: "Ca", a: "II"},
      {q: "Fe", a: "II,III"}, {q: "Cu", a: "I,II"}, {q: "Zn", a: "II"},
      {q: "OH", a: "I"}, {q: "NO3", a: "I"}, {q: "PO4", a: "III"}, 
      {q: "SO4", a: "II"}, {q: "CO3", a: "II"}, {q: "NH4", a: "I"}
    ];
    
    const rawSymbolData = [
      {q: "Hydrogen", a: "H"}, {q: "Carbon", a: "C"}, {q: "Nitrogen", a: "N"}, 
      {q: "Oxygen", a: "O"}, {q: "Sodium", a: "Na"}, {q: "Magnesium", a: "Mg"},
      {q: "Aluminium", a: "Al"}, {q: "Phosphorus", a: "P"}, {q: "Sulfur", a: "S"},
      {q: "Chlorine", a: "Cl"}, {q: "Potassium", a: "K"}, {q: "Calcium", a: "Ca"},
      {q: "Iron", a: "Fe"}, {q: "Copper", a: "Cu"}, {q: "Zinc", a: "Zn"},
      {q: "Hydroxide", a: "OH"}, {q: "Nitrate", a: "NO3"}, {q: "Phosphate", a: "PO4"},
      {q: "Sulfate", a: "SO4"}, {q: "Carbonate", a: "CO3"}, {q: "Ammonium", a: "NH4"}
    ];

    // --- TRẠNG THÁI ---
    let mode = "valency";
    let gameData = [];
    let currentIdx = 0;
    let score = 0;
    let streak = 0;
    let timer = 30;
    let interval;
    let answered = false;

    // --- TIỆN ÍCH ---
    function shuffleArray(array) {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
      }
      return newArr;
    }

    function formatFormula(t) { 
      return t.replace(/(\d+)/g, '<sub>$1</sub>'); 
    }

    function startMode(m) {
      mode = m;
      score = 0;
      streak = 0;
      currentIdx = 0;
      
      // Khởi tạo và sáo trộn câu hỏi
      gameData = shuffleArray(mode === "valency" ? rawValencyData : rawSymbolData);
      
      updateUI();
      document.getElementById("menu").classList.add("hidden");
      document.getElementById("game").classList.remove("hidden");
      document.getElementById("backBtn").classList.remove("hidden");
      loadQuestion();
    }

    // Chế độ "Tiếp tục" - giữ nguyên điểm và chuỗi
    function continueGame() {
      currentIdx = 0;
      // Sáo trộn lại danh sách cho lượt tiếp theo
      gameData = shuffleArray(mode === "valency" ? rawValencyData : rawSymbolData);
      loadQuestion();
    }

    function goHome() {
      clearInterval(interval);
      document.getElementById("menu").classList.remove("hidden");
      document.getElementById("game").classList.add("hidden");
      document.getElementById("backBtn").classList.add("hidden");
    }

    function loadQuestion() {
      if (currentIdx >= 21) {
        endGame();
        return;
      }
      
      const qData = gameData[currentIdx];
      document.getElementById("question").innerHTML = formatFormula(qData.q);
      document.getElementById("currentQuestionNum").innerText = currentIdx + 1;
      document.getElementById("progressBar").style.width = `${((currentIdx) / 21) * 100}%`;
      
      const input = document.getElementById("answer");
      input.value = ""; input.disabled = false; input.focus();
      document.getElementById("result").innerHTML = "";
      answered = false;
      toggleButtons(true);
      startTimer();
    }

    function startTimer() {
      clearInterval(interval);
      timer = 30;
      document.getElementById("timer").innerText = timer;
      document.getElementById("timer").classList.remove("text-red-500", "animate-pulse");
      interval = setInterval(() => {
        timer--;
        document.getElementById("timer").innerText = timer;
        if (timer <= 5) document.getElementById("timer").classList.add("text-red-500", "animate-pulse");
        if (timer <= 0) { clearInterval(interval); handleTimeOut(); }
      }, 1000);
    }

    function handleTimeOut() {
      if (answered) return;
      answered = true;
      let correct = gameData[currentIdx].a;
      document.getElementById("result").innerHTML = `<span class="text-red-500 font-bold bg-red-100/50 px-4 py-2 rounded-lg inline-block w-full text-sm">Hết giờ! Đáp án: ${correct}</span>`;
      streak = 0;
      document.getElementById("answer").disabled = true;
      toggleButtons(false);
      updateUI();
    }

    function checkAnswer() {
      if (answered) return;
      let user = document.getElementById("answer").value.trim();
      if (!user) { document.getElementById("answer").focus(); return; }
      
      clearInterval(interval);
      answered = true;
      document.getElementById("answer").disabled = true;

      let correct = gameData[currentIdx].a;
      let cleanUser = user.replace(/\s+/g, '');
      let cleanCorrect = correct.replace(/\s+/g, '');

      let isCorrect = (cleanUser === cleanCorrect);
      let isWarning = false;

      // Xử lý chấp nhận đáp án thiếu ",..." nhưng có cảnh báo
      if (!isCorrect && cleanCorrect.endsWith(",...") && cleanUser === cleanCorrect.slice(0, -4)) {
        isCorrect = true;
        isWarning = true;
      }

      const resDiv = document.getElementById("result");
      const container = document.getElementById("mainContainer");

      if (isCorrect) {
        if (isWarning) {
          resDiv.innerHTML = `<span class="text-orange-600 font-bold bg-orange-100/50 px-4 py-2 rounded-lg inline-block w-full text-xs sm:text-sm">⚠️ Tạm đúng! Nhớ thêm <b>,...</b> (Đáp án: ${correct})</span>`;
        } else {
          resDiv.innerHTML = `<span class="text-emerald-600 font-bold bg-emerald-100/50 px-4 py-2 rounded-lg inline-block w-full">✅ CHÍNH XÁC</span>`;
        }
        score++; streak++;
      } else {
        container.classList.add("wrong-shake");
        setTimeout(() => container.classList.remove("wrong-shake"), 400);
        resDiv.innerHTML = `<span class="text-red-600 text-xs sm:text-sm font-semibold bg-red-100/50 px-4 py-2 rounded-lg inline-block w-full leading-tight">❌ SAI! Đáp án: <b class="text-red-700 text-base">${correct}</b></span>`;
        streak = 0;
      }
      toggleButtons(false);
      updateUI();
    }

    function nextQuestion() {
      currentIdx++;
      loadQuestion();
    }

    function endGame() {
      clearInterval(interval);
      document.getElementById("progressBar").style.width = "100%";
      const resDiv = document.getElementById("result");
      resDiv.innerHTML = `
        <div class="fade-in py-2">
          <p class="text-blue-600 text-xl font-black">HOÀN THÀNH LƯỢT!</p>
          <p class="text-slate-600 text-sm mb-3">Bạn đang có ${score} điểm và chuỗi ${streak}.</p>
          <div class="flex flex-col gap-2">
            <button onclick="continueGame()" class="w-full px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-sm font-bold shadow-md transition-colors">Tiếp tục (Cộng dồn)</button>
            <button onclick="goHome()" class="w-full px-6 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-bold transition-colors">Quay về Menu</button>
          </div>
        </div>
      `;
      document.getElementById("nextBtn").classList.add("hidden");
      document.getElementById("submitBtn").classList.add("hidden");
    }

    function enterKey(e) { if (e.key === "Enter") answered ? (currentIdx >= 20 ? null : nextQuestion()) : checkAnswer(); }
    
    function toggleButtons(isAnswering) {
      document.getElementById("submitBtn").classList.toggle("hidden", !isAnswering);
      document.getElementById("nextBtn").classList.toggle("hidden", isAnswering);
    }

    function updateUI() {
      document.getElementById("score").innerText = score;
      document.getElementById("streak").innerText = streak;
    }
  </script>
</body>
</html>
