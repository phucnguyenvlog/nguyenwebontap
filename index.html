  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');
    
    body { 
      font-family: 'Nunito', sans-serif; 
      margin: 0; padding: 0; overflow: hidden;
    }

    sub { font-size: 0.6em; vertical-align: sub; font-weight: 900; }

    .animated-bg {
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #1e3a8a, #0c4a6e);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bubbles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; overflow: hidden; pointer-events: none;
    }

    .bubbles li {
      position: absolute; display: block; list-style: none;
      width: 20px; height: 20px; background: rgba(255, 255, 255, 0.1);

      animation: floatUp 20s linear infinite;
      bottom: -150px; border-radius: 50%;
    }

    .bubbles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
    .bubbles li:nth-child(2) { left: 10%; width: 30px; height: 30px; animation-delay: 2s; animation-duration: 12s; }
    .bubbles li:nth-child(3) { left: 70%; width: 25px; height: 25px; animation-delay: 4s; }
    .bubbles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 50%; }
      100% { transform: translateY(-1200px) rotate(720deg); opacity: 0; border-radius: 40%; }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);

    .wrong-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }

      40%, 80% { transform: translateX(6px); }
    }

    .roman-style { font-family: 'Georgia', serif; }
  </style>
</head>
<body class="animated-bg min-h-screen flex items-center justify-center p-4 relative">

    <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>

        <div class="bg-indigo-100 text-indigo-600 px-4 py-1.5 rounded-full text-xs font-black uppercase">

        Kiểm tra
      </button>
      
      <div id="feedback" class="mt-4 min-h-[90px] flex flex-col items-center justify-center gap-1"></div>

      <div class="flex gap-4 mt-2 pt-4 border-t border-slate-200/50">
        <div class="flex-1 bg-blue-50/50 p-2 rounded-2xl text-center">
          <p class="text-[10px] text-blue-400 font-bold uppercase mb-1">Điểm</p>
          <p id="score" class="text-2xl font-black text-blue-600">0</p>
        </div>
        <div class="flex-1 bg-orange-50/50 p-2 rounded-2xl text-center">
          <p class="text-[10px] text-orange-400 font-bold uppercase mb-1">Chuỗi</p>
          <p id="streak" class="text-2xl font-black text-orange-600">0</p>
        </div>
      </div>
    </div>

    <!-- RESULT -->
    <div id="screen-result" class="hidden">
      <div class="text-6xl mb-4">🏆</div>
      <h2 class="text-3xl font-black text-slate-800 mb-2 uppercase">Kết quả</h2>
      <div class="bg-white/50 rounded-3xl py-6 px-4 mb-8 border border-white shadow-inner">
        <p id="final-score" class="text-7xl font-black text-indigo-600">0</p>
      </div>
      <div class="space-y-4">
        <button onclick="startGame(currentMode)" class="w-full bg-emerald-500 text-white py-4 rounded-2xl font-black text-xl uppercase shadow-lg">Làm lại</button>
        <button onclick="backToMenu()" class="w-full bg-white text-slate-600 py-4 rounded-2xl font-black text-xl uppercase border-2 border-slate-200">Về Menu</button>
      </div>
    </div>
  </div>

  <script>
    const dataSet = {
      valency: [
        {q: "H", a: "I"}, {q: "Na", a: "I"}, {q: "K", a: "I"}, {q: "Ag", a: "I"}, {q: "OH", a: "I"}, {q: "NO3", a: "I"},
        {q: "O", a: "II"}, {q: "Mg", a: "II"}, {q: "Ca", a: "II"}, {q: "Ba", a: "II"}, {q: "Zn", a: "II"}, {q: "Cu", a: "I,II"}, {q: "SO4", a: "II"}, {q: "CO3", a: "II"},
        {q: "Al", a: "III"}, {q: "PO4", a: "III"}, {q: "Fe", a: "II,III"}, {q: "P", a: "III,V"}, 
        {q: "S", a: "II,IV,VI"}, {q: "C", a: "II,IV"}, {q: "Cl", a: "I,..."}, {q: "N", a: "II,III,IV,..."} 
      ],
      symbol: [
        {q: "Hydrogen", a: "H"}, {q: "Carbon", a: "C"}, {q: "Nitrogen", a: "N"}, {q: "Oxygen", a: "O"}, 
        {q: "Sodium", a: "Na"}, {q: "Magnesium", a: "Mg"}, {q: "Aluminium", a: "Al"}, {q: "Silicon", a: "Si"}, 
        {q: "Phosphorus", a: "P"}, {q: "Sulfur", a: "S"}, {q: "Chlorine", a: "Cl"}, {q: "Potassium", a: "K"}, 
        {q: "Calcium", a: "Ca"}, {q: "Iron", a: "Fe"}, {q: "Copper", a: "Cu"}, {q: "Zinc", a: "Zn"}
      ]
    };

    let questions = [], currentIdx = 0, score = 0, streak = 0, isStateChecking = false, currentMode = "";
    let isSoundEnabled = true;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol=0.1) {
      if (!isSoundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function playSound(type) {
      if(type === 'correct') { playTone(600, 'sine', 0.1); setTimeout(() => playTone(800, 'sine', 0.15), 100); }
      else if(type === 'wrong') { playTone(200, 'sawtooth', 0.3); }
      else if(type === 'click') { playTone(800, 'sine', 0.05, 0.05); }
    }

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      document.getElementById("soundBtn").innerText = isSoundEnabled ? "🔊" : "🔇";
    }

    function startGame(mode) {
      playSound('click');
      currentMode = mode;
      questions = [...dataSet[mode]].sort(() => Math.random() - 0.5);
      currentIdx = 0; score = 0; streak = 0;
      updateStats();
      document.getElementById('screen-menu').classList.add('hidden');
      document.getElementById('screen-result').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');
      nextQuestion();
    }

    function nextQuestion() {
      isStateChecking = false;
      const q = questions[currentIdx];
      const qEl = document.getElementById('question');
      qEl.innerHTML = q.q.replace(/(\d+)/g, '<sub>$1</sub>');
      
      const input = document.getElementById('answer-input');
      input.value = ""; input.disabled = false; input.focus();
      if(currentMode === 'valency') input.classList.add('roman-style');
      else input.classList.remove('roman-style');

      document.getElementById('progress-text').innerText = `${currentIdx + 1}/${questions.length}`;
      document.getElementById('feedback').innerHTML = "";
      document.getElementById('btn-main').innerText = "Kiểm tra";
      document.getElementById('btn-main').className = "w-full bg-slate-800 text-white py-4 rounded-2xl font-black text-xl shadow-lg uppercase transition-all active:scale-95";
    }

    function normalize(str) {
      // Nhận diện bất kỳ tổ hợp dấu chấm nào từ 2 cái trở lên là mở rộng
      const hasDots = /\.{2,}/.test(str); 
      const parts = str.replace(/\s+/g, '')
                     .replace(/\.+/g, '') 
                     .split(',')
                     .filter(x => x)
                     .sort();
      return { parts, hasDots };
    }

    function checkAnswer(userStr, qObj) {
      if (currentMode === 'symbol') {
        if (userStr === qObj.a) return { ok: true, msg: "Chính xác!" };
        if (userStr.toLowerCase() === qObj.a.toLowerCase()) return { ok: false, msg: "Sai! Chữ cái đầu phải viết HOA." };
        return { ok: false, msg: "" };
      }

      if (/[a-z]/.test(userStr)) return { ok: false, msg: "Lỗi: Phải gõ chữ La Mã IN HOA!" };

      const { parts: userParts, hasDots: userHasDots } = normalize(userStr);
      const targetParts = qObj.a.replace(/\.+/g, '').split(',').sort();

      // --- LOGIC LINH HOẠT CHO CLO (Cl) & LƯU HUỲNH (S) ---
      const flexibleElements = {
        "Cl": ["I", "III", "V", "VII"],
        "S": ["II", "IV", "VI"]
      };

      if (flexibleElements[qObj.q]) {
        const possible = flexibleElements[qObj.q];
        if (userParts.length > 0 && userParts.every(p => possible.includes(p))) {
          // Clo và Nitơ có logic cần dấu chấm
          if (qObj.q === "Cl") {
            if (userParts.includes("I")) {
               if (userHasDots) return { ok: true, msg: "Đúng hoàn hảo! ✅" };
               return { ok: true, msg: "Đúng! Nên thêm dấu '...' cho Clo." };
            }
            return { ok: true, msg: "Đúng! Chú ý: Clo thường có hóa trị I phổ biến." };
          }
          // S không cần dấu chấm trong đáp án gốc
          if (userParts.length === possible.length) return { ok: true, msg: "Đúng hoàn hảo! ✅" };
          return { ok: true, msg: "Chính xác! (Vẫn còn hóa trị khác)" };
        }
        return { ok: false, msg: "" };
      }

      // --- LOGIC NITƠ (N) ---
      if (qObj.q === "N") {
        const nStandard = ["II", "III", "IV"];
        const isStandard = nStandard.length === userParts.length && nStandard.every((v, i) => v === userParts[i]);
        if (isStandard) {
          if (userHasDots) return { ok: true, msg: "Đúng hoàn hảo! ✅" };
          return { ok: true, msg: "Đúng! Nhớ thêm dấu '...' cho Nitơ nhé." };
        }
        if (userParts.includes("I") && userParts.every(p => ["I", "II", "III", "IV"].includes(p))) {
          return { ok: true, msg: "Vẫn đúng! Nhưng II, III, IV là phổ biến nhất." };
        }
        return { ok: false, msg: "" };
      }

      // --- LOGIC CHUNG ---
      if (userParts.length === targetParts.length && userParts.every((v, i) => v === targetParts[i])) {
        return { ok: true, msg: "Chính xác!" };
      }
      if (userParts.length === 1 && targetParts.includes(userParts[0])) {
        return { ok: true, msg: "Đúng! (Vẫn còn hóa trị khác)" };
      }

      return { ok: false, msg: "" };
    }

    function handleAction() {
      if (!isStateChecking) {
        const inputEl = document.getElementById('answer-input');
        const userValue = inputEl.value.trim();
        if(!userValue) return;

        const result = checkAnswer(userValue, questions[currentIdx]);
        isStateChecking = true;
        inputEl.disabled = true;
        
        const feedbackEl = document.getElementById('feedback');
        const btnMain = document.getElementById('btn-main');

        if (result.ok) {
          score++; streak++; playSound('correct');
          feedbackEl.innerHTML = `<span class="text-emerald-500 font-bold text-lg">✔ ${result.msg || 'Chính xác!'}</span>`;
          btnMain.className = "w-full bg-emerald-500 text-white py-4 rounded-2xl font-black text-xl shadow-lg uppercase";
        } else {
          streak = 0; playSound('wrong');
          document.getElementById('app-card').classList.add('wrong-shake');
          setTimeout(() => document.getElementById('app-card').classList.remove('wrong-shake'), 400);
          feedbackEl.innerHTML = `<div class="text-red-500 text-center leading-tight"><span class="font-bold">${result.msg || 'Chưa đúng!'}</span><br><span class="text-slate-400 text-sm">Đáp án: <b class="text-slate-700 text-xl">${questions[currentIdx].a}</b></span></div>`;
          btnMain.className = "w-full bg-red-500 text-white py-4 rounded-2xl font-black text-xl shadow-lg uppercase";
        }
        btnMain.innerText = "Tiếp theo ❯";
        updateStats();
      } else {
        currentIdx++;
        if (currentIdx >= questions.length) endGame(); else nextQuestion();
      }
    }

    function updateStats() {
      document.getElementById('score').innerText = score;
      document.getElementById('streak').innerText = streak;
    }

    function endGame() {
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-result').classList.remove('hidden');
      document.getElementById('final-score').innerText = score;
    }

    function backToMenu() {
      playSound('click');
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-result').classList.add('hidden');
      document.getElementById('screen-menu').classList.remove('hidden');
    }

    document.getElementById('answer-input').addEventListener('keypress', (e) => { 
      if(e.key === 'Enter') handleAction(); 
    });
  </script>
</body>
</html>
